name: Build & Release NicaLingo Multiplatform

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------
  # JOB 1: ANDROID
  # ----------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK (Android)
        run: flutter build apk --release

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

  # ----------------------------------------------------
  # JOB 2: WEB (Compila y publica en GitHub Pages)
  # ----------------------------------------------------
  build-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar Web (con base-href para GitHub Pages)
        run: flutter build web --release --base-href /Nicalingo/

      - name: Comprimir Web en ZIP para el Release
        run: zip -r nicalingo_web.zip build/web

      - name: Guardar Web ZIP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: nicalingo_web.zip

      - name: Configurar artefacto de Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Desplegar sitio en vivo
        id: deployment
        uses: actions/deploy-pages@v4

  # ----------------------------------------------------
  # JOB 3: WINDOWS
  # ----------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar Windows
        run: flutter build windows --release

      - name: Comprimir Windows en ZIP
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nicalingo_windows.zip

      - name: Guardar Windows ZIP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: nicalingo_windows.zip

  # ----------------------------------------------------
  # JOB 4: PUBLICAR RELEASE COMPLETO
  # ----------------------------------------------------
  publish-release:
    needs: [build-android, build-web, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraer versión de pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          TAG="v$(echo $VERSION | cut -d'+' -f1)"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: "Actualización automática de NicaLingo."
          draft: false
          prerelease: false
          files: |
            release-files/app-release.apk
            release-files/nicalingo_web.zip
            release-files/nicalingo_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}