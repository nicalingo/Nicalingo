name: Build & Release NicaLingo Multiplatform

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------
  # JOB 0: CALCULAR VERSIÓN AUTOMÁTICA
  # ----------------------------------------------------
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ github.run_number }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extraer versión de pubspec.yaml
        id: version
        run: |
          RAW_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          BASE_VERSION=$(echo$RAW_VERSION | cut -d'+' -f1)
          echo "version_name=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=v$BASE_VERSION" >> $GITHUB_OUTPUT

  # ----------------------------------------------------
  # JOB 1: ANDROID
  # ----------------------------------------------------
  build-android:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: |
          flutter clean
          flutter pub get

      - name: Compilar APK (Android) con versión dinámica
        run: |
          flutter build apk --release \
            --build-name=${{ needs.prepare-version.outputs.version_name }} \
            --build-number=${{ needs.prepare-version.outputs.build_number }}

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

  # ----------------------------------------------------
  # JOB 2: WEB (Compila y publica en GitHub Pages)
  # ----------------------------------------------------
  build-web:
    needs: prepare-version
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: |
          flutter clean
          flutter pub get

      - name: Compilar Web con versión dinámica
        run: |
          flutter build web --release --base-href /Nicalingo/ \
            --build-name=${{ needs.prepare-version.outputs.version_name }} \
            --build-number=${{ needs.prepare-version.outputs.build_number }}

      - name: Comprimir Web en ZIP para el Release
        run: zip -r nicalingo_web.zip build/web

      - name: Guardar Web ZIP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: nicalingo_web.zip

      - name: Configurar artefacto de Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Desplegar sitio en vivo
        id: deployment
        uses: actions/deploy-pages@v4

  # ----------------------------------------------------
  # JOB 3: WINDOWS
  # ----------------------------------------------------
  build-windows:
    needs: prepare-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar NuGet
        uses: nuget/setup-nuget@v2

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Habilitar compilación Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Instalar dependencias
        run: |
          flutter clean
          flutter pub get

      - name: Compilar Windows con versión dinámica
        run: |
          flutter build windows --release `
            --build-name=${{ needs.prepare-version.outputs.version_name }} `
            --build-number=${{ needs.prepare-version.outputs.build_number }}

      - name: Comprimir Windows en ZIP
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nicalingo_windows.zip

      - name: Guardar Windows ZIP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: nicalingo_windows.zip

  # ----------------------------------------------------
  # JOB 4: PUBLICAR RELEASE COMPLETO
  # ----------------------------------------------------
  publish-release:
    needs: [prepare-version, build-android, build-web, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publicar o Actualizar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.release_tag }}
          name: Release ${{ needs.prepare-version.outputs.release_tag }}
          body: "Actualización automática: Compilación #${{ needs.prepare-version.outputs.build_number }} para Android, Windows y Web."
          draft: false
          prerelease: false
          files: |
            release-files/app-release.apk
            release-files/nicalingo_web.zip
            release-files/nicalingo_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}