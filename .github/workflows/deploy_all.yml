name: Build & Release NicaLingo Multiplatform

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - run: zip -r nicalingo_web.zip build/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: nicalingo_web.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nicalingo_windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: nicalingo_windows.zip

  publish-release:
    needs: [build-android, build-web, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          TAG="v$(echo $VERSION | cut -d'+' -f1)"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: "Actualización automática de NicaLingo."
          draft: false
          prerelease: false
          files: |
            release-files/app-release/app-release.apk
            release-files/web-release/nicalingo_web.zip
            release-files/windows-release/nicalingo_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}